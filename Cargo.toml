[package]
name = "inkline"
version = "0.1.0"
edition = "2024"
description = "zsh-style autosuggestions and syntax highlighting for bash, as a readline add-on"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
